# This rule is not used by the project questdb-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the crd.questdb.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: questdb-operator
    app.kubernetes.io/managed-by: kustomize
  name: questdbbackupschedule-editor-role
rules:
- apiGroups:
  - crd.questdb.io
  resources:
  - questdbbackupschedules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - crd.questdb.io
  resources:
  - questdbbackupschedules/status
  verbs:
  - get
