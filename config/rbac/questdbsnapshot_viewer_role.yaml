# This rule is not used by the project questdb-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to crd.questdb.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: questdb-operator
    app.kubernetes.io/managed-by: kustomize
  name: questdbsnapshot-viewer-role
rules:
- apiGroups:
  - crd.questdb.io
  resources:
  - questdbsnapshots
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - crd.questdb.io
  resources:
  - questdbsnapshots/status
  verbs:
  - get
