---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-crd-questdb-io-v1beta2-questdb
  failurePolicy: Fail
  name: mquestdb-v1beta2.kb.io
  rules:
  - apiGroups:
    - crd.questdb.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - questdbs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-crd-questdb-io-v1beta2-questdbbackup
  failurePolicy: Fail
  name: mquestdbbackup-v1beta2.kb.io
  rules:
  - apiGroups:
    - crd.questdb.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - questdbbackups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-crd-questdb-io-v1beta2-questdbbackupschedule
  failurePolicy: Fail
  name: mquestdbbackupschedule-v1beta2.kb.io
  rules:
  - apiGroups:
    - crd.questdb.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - questdbbackupschedules
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-crd-questdb-io-v1beta2-questdb
  failurePolicy: Fail
  name: vquestdb-v1beta2.kb.io
  rules:
  - apiGroups:
    - crd.questdb.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - questdbs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-crd-questdb-io-v1beta2-questdbbackup
  failurePolicy: Fail
  name: vquestdbbackup-v1beta2.kb.io
  rules:
  - apiGroups:
    - crd.questdb.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - questdbbackups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-crd-questdb-io-v1beta2-questdbbackupschedule
  failurePolicy: Fail
  name: vquestdbbackupschedule-v1beta2.kb.io
  rules:
  - apiGroups:
    - crd.questdb.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - questdbbackupschedules
  sideEffects: None
